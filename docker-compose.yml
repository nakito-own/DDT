services:
  mysql:
    image: mysql:8.0
    container_name: ddt-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ddt}
      MYSQL_USER: ${MYSQL_USER:-ddt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ddt_password}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    image: mysql:8.0
    container_name: ddt-migrate
    restart: "no"
    entrypoint: ["/bin/bash", "/run-migrations.sh"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ddt}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/run-migrations.sh:ro
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddt-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ddt}
      DB_USER: ${MYSQL_USER:-ddt_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ddt_password}
      EWS_SERVER: ${EWS_SERVER:-owa.mos.ru}
      EWS_AUTH_TYPE: ${EWS_AUTH_TYPE:-NTLM}
      EWS_SERVICE_ENDPOINT: ${EWS_SERVICE_ENDPOINT:-}
      EWS_VERIFY_MAX_ATTEMPTS: ${EWS_VERIFY_MAX_ATTEMPTS:-3}
      EWS_VERIFY_RETRY_DELAY_SECONDS: ${EWS_VERIFY_RETRY_DELAY_SECONDS:-1.0}
      EWS_TIMEZONE: ${EWS_TIMEZONE:-Europe/Moscow}
      EWS_CREDENTIALS_KEY: ${EWS_CREDENTIALS_KEY:-}
      EWS_SESSION_TTL_HOURS: ${EWS_SESSION_TTL_HOURS:-24}
      EWS_REMEMBER_TTL_DAYS: ${EWS_REMEMBER_TTL_DAYS:-30}
      EWS_NOTIFICATION_MODE: ${EWS_NOTIFICATION_MODE:-pull}
      EWS_NOTIFICATION_STREAM_TIMEOUT: ${EWS_NOTIFICATION_STREAM_TIMEOUT:-1}
      EWS_NOTIFICATION_POLL_INTERVAL: ${EWS_NOTIFICATION_POLL_INTERVAL:-15}
      EWS_NOTIFICATION_PULL_TIMEOUT: ${EWS_NOTIFICATION_PULL_TIMEOUT:-10}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddt-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
