name: ddt_frontend
description: "Ctatyc Flutter frontend"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  bolt_ui_kit: ^1.2.2
  get_storage: ^2.1.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  flutter_widget_from_html: ^0.17.2
  url_launcher: ^6.3.2
  web: ^1.1.1
  pointer_interceptor: ^0.10.1+2
  infinite_calendar_view: ^2.11.5
  flutter_gantt: ^1.2.2
  web_socket_channel: ^3.0.3
  go_router: ^14.8.1
  toastification: ^3.2.0
  fl_chart: ^1.2.0
  font_awesome_flutter: ^11.0.0
  markdown: ^7.3.1
  markdown_live: ^0.1.0
  share_plus: ^12.0.2
  liquid_glass_native: ^0.3.1
  image_picker: ^1.2.4
  file_picker: ^10.3.3
  crop_your_image: ^2.0.1
  nodeline: ^0.1.2
  flutter_smooth_markdown: ^0.10.0

dependency_overrides:
  get_storage:
    path: packages/get_storage
  flutter_gantt:
    path: packages/flutter_gantt
  # 0.1.2 on pub.dev omits the tool bloc and imports dart:io from the toolbar.
  nodeline:
    path: packages/nodeline

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/status-logo.png
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/status-logo.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#000000"
  web:
    generate: true
    background_color: "#000000"
    theme_color: "#00A8FF"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
  linux:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/login/
    - assets/images/иконка_зум.png
    - assets/images/иконка_телемост.png
    - assets/images/иконка_дит.png
    - assets/fonts/golos_text/OFL.txt

  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/golos_text/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/golos_text/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/golos_text/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/golos_text/GolosText-Bold.ttf
          weight: 700
        - asset: assets/fonts/golos_text/GolosText-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/golos_text/GolosText-Black.ttf
          weight: 900
