server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.mjs$ {
        default_type application/javascript;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
    }

    location ~* \.svg$ {
        default_type image/svg+xml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker DNS. A variable in proxy_pass makes nginx resolve the
    # name on each request, so a recreated container is not stuck
    # on the previous IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/owa/ {
        client_max_body_size 40m;
        set $upstream mail:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /api/krr/ {
        client_max_body_size 2m;
        set $upstream analytics:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/analytics/ {
        client_max_body_size 2m;
        set $upstream analytics:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /api/task-analytics/ {
        client_max_body_size 2m;
        set $upstream analytics:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /api/ {
        client_max_body_size 8m;
        set $upstream backend:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
