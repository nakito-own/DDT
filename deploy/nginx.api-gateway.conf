server {
    listen 80;
    server_name _;

    # Docker DNS. A variable in proxy_pass makes nginx resolve the
    # name on each request, so a recreated container is not stuck
    # on the previous IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Mail process accepts OWA JSON up to 40 MB.
    location /api/owa/ {
        client_max_body_size 40m;
        set $upstream mail:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # Client uploads a KRR page with a 2 minute timeout.
    location /api/krr/ {
        client_max_body_size 2m;
        set $upstream analytics:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/analytics/ {
        client_max_body_size 2m;
        set $upstream analytics:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /api/task-analytics/ {
        client_max_body_size 2m;
        set $upstream analytics:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # Avatar uploads are accepted up to 8 MB. Notifications use this prefix too.
    location /api/ {
        client_max_body_size 8m;
        set $upstream backend:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
